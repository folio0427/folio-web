<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下載 Folio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FAF3E7; --parchment:#F8F1E4; --walnut:#3D2F1F; --walnut-soft:#6B5641; --sage:#6B8064; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Noto Sans TC',-apple-system,sans-serif; background:var(--parchment); color:var(--walnut);
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .wrap{ max-width:360px; }
  h1{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.6rem; letter-spacing:0.04em; margin-bottom:10px; }
  p{ color:var(--walnut-soft); font-size:0.95rem; line-height:1.7; margin-bottom:26px; }
  .stores{ display:flex; flex-direction:column; gap:12px; }
  .store{ display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 22px; border-radius:999px; text-decoration:none; font-weight:600;
    background:#1c150e; color:var(--cream); transition:transform .25s, box-shadow .25s; }
  .store:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(61,47,31,.2); }
  .store svg{ width:22px; height:22px; }
  .hint{ margin-top:22px; font-size:0.8rem; color:var(--walnut-soft); }
  a.plain{ color:var(--sage); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>下載 Folio</h1>
    <p id="msg">正在帶你前往商店…</p>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/tw/app/folio-find-your-book-buddy/id6771667110">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.42 2.22-1.19 3.02-.83.87-2.2 1.55-3.35 1.46-.14-1.1.42-2.28 1.16-3.03.83-.86 2.28-1.5 3.38-1.45zM20.7 17.2c-.6 1.37-.9 1.98-1.67 3.19-1.08 1.68-2.6 3.78-4.48 3.79-1.67.02-2.1-1.09-4.37-1.08-2.27.01-2.74 1.1-4.42 1.08-1.88-.02-3.32-1.9-4.4-3.58C-1.4 15.9-1.7 9.14 1.06 5.66c.98-1.24 2.53-2.03 4.16-2.06 1.7-.03 2.77 1.11 4.17 1.11 1.36 0 2.19-1.11 4.16-1.11 1.45 0 2.99.79 4.09 2.16-3.6 1.97-3 7.1.06 8.44z"/></svg>
        App Store（iOS）
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.yuliao.folio">
        <svg viewBox="0 0 24 24"><path fill="#00D2FF" d="M3.6 1.8 13 11.2 3.6 20.6c-.35-.2-.6-.6-.6-1.1V2.9c0-.5.25-.9.6-1.1z"/><path fill="#00E676" d="M3.6 1.8c.3-.17.68-.2 1.05.02l11.3 6.53-3 3.0L3.6 1.8z"/><path fill="#FFEA00" d="M15.95 8.35 20 10.7c.7.4.7 1.4 0 1.8l-4.05 2.35-3-3.0 3-2.5z"/><path fill="#FF3D00" d="M4.65 22.16c-.37.21-.75.19-1.05.02l9.4-9.4 3 3.0-11.35 6.38z"/></svg>
        Google Play（Android）
      </a>
    </div>
    <p class="hint">看看你是哪一種深夜書店人格 → <a class="plain" href="/quiz/">foliomatch.app/quiz</a></p>
  </div>
  <script>
    (function(){
      var ua = navigator.userAgent || navigator.vendor || '';
      var APPLE = document.getElementById('ios').href;
      var PLAY = document.getElementById('android').href;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);
      if (isAndroid) { document.getElementById('msg').textContent = '正在前往 Google Play…'; location.replace(PLAY); }
      else if (isIOS) { document.getElementById('msg').textContent = '正在前往 App Store…'; location.replace(APPLE); }
      else { document.getElementById('msg').textContent = '選擇你的平台，開始使用 Folio。'; }
    })();
  </script>
</body>
</html>
